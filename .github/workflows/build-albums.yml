name: Build Catalog

# Audio is no longer built here. WAV masters live on Carl's machine under
# ~/Music/Masters and scripts/sync-album.sh encodes + uploads the MP3/M4A to the
# "latest" release. This workflow only regenerates catalog.json and the
# playlists from the text in the repo, so it runs in seconds and can never
# delete a release asset.

on:
  push:
    paths:
      - "**/README.md"
      - "**/LYRICS.txt"
      - "**/ALBUM.json"
      - "**/COVER.*"
      - "scripts/generate-catalog.py"
      - ".github/workflows/build-albums.yml"
  workflow_dispatch:

# Two quick pushes shouldn't race each other into a rejected push.
concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate catalog.json and playlists
        run: python3 scripts/generate-catalog.py

      - name: Commit catalog and playlists
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add catalog.json
          find . -name "*.m3u8" -not -path "./.git/*" -print0 | xargs -0 -r git add

          if git diff --staged --quiet; then
            echo "Catalog already up to date."
            exit 0
          fi

          git commit -m "Update catalog and playlists [skip ci]"

          # Rebase onto anything that landed while we were building.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
