name: Build Catalog

# Audio is no longer built here. WAV masters live on Carl's machine under
# ~/Music/Masters and scripts/sync-album.sh encodes + uploads the MP3/M4A to the
# "latest" release. This workflow verifies that catalog.json and the playlists
# are current. The pre-commit hook stages them with their source changes, so CI
# never creates a follow-up commit that can leave a local branch behind.

on:
  push:
    paths:
      - "**/README.md"
      - "**/LYRICS.txt"
      - "**/ALBUM.json"
      - "**/COVER.*"
      - "**/*.m3u8"
      - "catalog.json"
      - "scripts/generate-catalog.py"
      - "scripts/install-hooks.sh"
      - ".githooks/**"
      - ".github/workflows/build-albums.yml"
  workflow_dispatch:

# Avoid duplicate validation runs for rapid updates.
concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate catalog.json and playlists
        run: python3 scripts/generate-catalog.py

      - name: Verify generated catalog and playlists
        run: |
          set -e
          git add -A -- catalog.json ':(glob)**/*.m3u8'
          if ! git diff --cached --quiet -- catalog.json ':(glob)**/*.m3u8'; then
            echo "::error::Generated catalog or playlists are out of date."
            echo "Run ./scripts/generate-catalog.py, then commit catalog.json and the generated playlists with the source changes."
            git diff --cached -- catalog.json ':(glob)**/*.m3u8'
            exit 1
          fi
